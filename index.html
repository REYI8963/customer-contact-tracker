<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MR.LIVING倉儲客服系統</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #F1F5F9;
    color: #0F172A;
  }
  :root {
    --bg: #F1F5F9;
    --surface: #FFFFFF;
    --text: #0F172A;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --primary: #4F46E5;
    --primary-dark: #4338CA;
    --primary-light: #EEF2FF;
    --danger: #EF4444;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
  }
  #app {
    max-width: 840px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    letter-spacing: 0.01em;
  }

  .cct-stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 500px) {
    .cct-stats-grid { grid-template-columns: 1fr; gap: 8px; }
  }
  .cct-stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .cct-stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .cct-stat-info { display: flex; flex-direction: column; }
  .cct-stat-label { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
  .cct-stat-num { font-size: 22px; font-weight: 800; color: #0F172A; line-height: 1.2; }
  .cct-stat-icon {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .cct-stat-icon.primary { background: #EEF2FF; color: #4F46E5; }
  .cct-stat-icon.warning { background: #FFF7ED; color: #EA580C; }
  .cct-stat-icon.success { background: #ECFDF5; color: #059669; }

  .cct-login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .cct-login-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 40px 32px; width: 100%; max-width: 360px; text-align: center;
    box-shadow: var(--shadow-md);
  }
  .cct-logo {
    width: 52px; height: 52px; border-radius: 16px; 
    background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%); 
    color: white;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
    letter-spacing: 0.08em; margin: 0 auto 20px;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
  }
  .cct-logo-sm { width: 38px; height: 38px; font-size: 12px; margin: 0; border-radius: 12px; }
  .cct-login-card h1 { font-size: 18px; margin: 0 0 4px; font-weight: 800; color: #0F172A; }
  .cct-login-sub { color: var(--text-muted); font-size: 13px; margin: 0 0 24px; }
  .cct-wh-picker { display: flex; gap: 10px; margin-bottom: 20px; }
  .cct-wh-btn {
    flex: 1; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px;
    background: var(--bg); font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;
    transition: all 0.2s ease;
  }
  .cct-wh-btn.active {
    background: var(--primary-light); border-color: var(--primary); color: var(--primary);
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.15);
  }
  .cct-login-card input {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 15px; margin-bottom: 14px; background: var(--bg); color: var(--text);
    transition: all 0.2s ease;
  }
  .cct-login-card input:focus { outline: none; border-color: var(--primary); background: #FFFFFF; }
  .cct-login-error { color: var(--danger); font-size: 13px; margin-bottom: 12px; text-align: left; font-weight: 600; }
  .cct-login-btn { width: 100%; justify-content: center; }

  .cct-header {
    display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;
    background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
  }
  .cct-header-left { display: flex; align-items: center; gap: 12px; }
  .cct-header-title { font-weight: 800; font-size: 16px; color: #0F172A; }
  .cct-header-sub { font-size: 12px; color: var(--primary); font-weight: 600; background: var(--primary-light); padding: 2px 8px; border-radius: 6px; display: inline-block; }
  .cct-sync-status { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .cct-sync-status.online { background: #DCFCE7; color: #15803D; }
  .cct-sync-status.local { background: #FEF3C7; color: #B45309; }

  .cct-tabs { display: flex; gap: 8px; padding: 10px 20px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  .cct-tab { border: none; background: none; padding: 10px 18px; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
  .cct-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .cct-subtabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .cct-subtab { border: 1.5px solid var(--border); background: var(--surface); padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
  .cct-subtab.active { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25); }
  .cct-main { padding: 18px 20px 100px; }

  .cct-filter-bar { display: flex; gap: 10px; margin-bottom: 14px; }
  .cct-search-box, .cct-date-box {
    display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 10px 14px; color: var(--text-muted); flex: 1; box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .cct-search-box:focus-within, .cct-date-box:focus-within { border-color: var(--primary); background: #FFFFFF; }
  .cct-search-wide { margin-bottom: 14px; }
  .cct-search-box input, .cct-date-box input { border: none; outline: none; background: none; font-size: 14px; font-weight: 500; color: var(--text); width: 100%; }
  .cct-date-box { flex: 1.2; position: relative; }
  .cct-clear-date { border: none; background: none; cursor: pointer; color: var(--text-muted); padding: 0; font-weight: 700; }
  .cct-cat-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .cct-cat-chip {
    border: 1.5px solid var(--chip-color, var(--border)); background: var(--surface); color: var(--chip-color, var(--text));
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }
  .cct-cat-chip.active { background: var(--chip-color, var(--primary)); color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transform: translateY(-1px); }
  .cct-cat-picker { display: flex; flex-wrap: wrap; gap: 8px; }

  .cct-list { display: flex; flex-direction: column; gap: 14px; }
  .cct-empty { text-align: center; color: var(--text-muted); padding: 48px 0; font-size: 14px; font-weight: 500; }
  .cct-card {
    display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow-sm); transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .cct-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .cct-card-bar { width: 6px; background: var(--cat-color); flex-shrink: 0; }
  .cct-card-body { padding: 16px 18px; flex: 1; }
  .cct-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cct-tag { color: white; font-size: 12px; font-weight: 800; padding: 3px 12px; border-radius: 999px; letter-spacing: 0.02em; }
  .cct-card-time { font-size: 12px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .cct-age-badge { background: #FFF7ED; color: #C2410C; border: 1px solid #FFEDD5; font-weight: 800; padding: 2px 10px; border-radius: 999px; margin-left: 6px; font-size: 11px; }
  .cct-card-main { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 14px; margin-bottom: 10px; align-items: center; }
  .cct-phone { font-weight: 800; color: #0F172A; font-size: 15px; }
  .cct-name { font-weight: 700; color: #334155; }
  .cct-area { color: var(--primary-dark); font-weight: 600; background: var(--primary-light); padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .cct-contact { color: var(--text-muted); font-weight: 500; font-size: 13px; }
  .cct-card-extra { display: flex; flex-direction: column; gap: 6px; background: #F8FAFC; border: 1px solid #F1F5F9; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  .cct-extra-item { display: flex; gap: 8px; font-size: 13px; }
  .cct-extra-label { color: var(--text-muted); flex-shrink: 0; font-weight: 600; }
  .cct-extra-value { color: #1E293B; font-weight: 600; word-break: break-word; }
  .cct-balance-badge { display: inline-flex; align-items: center; gap: 4px; background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; width: fit-content; }
  .cct-resolved-note { font-size: 12px; color: var(--text-muted); margin-top: 6px; font-weight: 500; }
  .cct-card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  .cct-btn {
    display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 10px; padding: 9px 16px;
    font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
  }
  .cct-btn-primary {
    background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%); color: white;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
  }
  .cct-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35); }
  .cct-btn-outline { background: var(--surface); border: 1.5px solid var(--border); color: #334155; }
  .cct-btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .cct-btn-ghost { background: none; color: var(--text-muted); }
  .cct-btn-ghost:hover { color: var(--text); }
  .cct-icon-btn { border: none; background: none; cursor: pointer; color: var(--text-muted); padding: 8px; border-radius: 10px; font-weight: 700; transition: all 0.2s; }
  .cct-icon-btn:hover { background: var(--border); color: var(--text); }

  .cct-fab {
    position: fixed; bottom: 28px; right: 28px; width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%); color: white; border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35); cursor: pointer; font-size: 28px; line-height: 1;
    transition: transform 0.2s ease, box-shadow 0.2s ease; z-index: 50;
  }
  .cct-fab:hover { transform: scale(1.06) rotate(90deg); box-shadow: 0 12px 24px rgba(79, 70, 229, 0.45); }

  .cct-modal-backdrop {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .cct-modal {
    background: var(--surface); width: 100%; max-width: 500px; max-height: 90vh;
    border-radius: 24px 24px 0 0; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @media (min-width: 640px) {
    .cct-modal-backdrop { align-items: center; }
    .cct-modal { border-radius: 24px; max-height: 85vh; }
  }
  .cct-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); background: #FAFBFD; }
  .cct-modal-header h2 { font-size: 17px; margin: 0; font-weight: 800; color: #0F172A; }
  .cct-modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .cct-modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--border); background: #FAFBFD; }
  .cct-hint { font-size: 13px; color: var(--text-muted); margin: 0 0 16px; line-height: 1.6; font-weight: 500; }
  .cct-toast {
    color: #047857; background: #ECFDF5; border: 1px solid #A7F3D0; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; font-weight: 700; text-align: center;
  }

  .cct-field { margin-bottom: 16px; position: relative; }
  .cct-field label { display: block; font-size: 12px; font-weight: 800; color: #475569; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .cct-field input, .cct-field select, .cct-field textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px;
    background: #F8FAFC; color: var(--text); font-family: inherit; font-weight: 500; transition: all 0.2s;
  }
  .cct-field textarea { resize: vertical; }
  .cct-field input:focus, .cct-field select:focus, .cct-field textarea:focus { outline: none; border-color: var(--primary); background: #FFFFFF; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
  .cct-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cct-divider { height: 1px; background: var(--border); margin: 8px 0 18px; }
  .cct-toggle { display: flex; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg); padding: 2px; }
  .cct-toggle-btn { flex: 1; border: none; background: transparent; padding: 9px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text-muted); border-radius: 10px; transition: all 0.2s; }
  .cct-toggle-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25); }
  .cct-checkbox { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--border); background: #F8FAFC; border-radius: 12px; padding: 11px 14px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; width: 100%; transition: all 0.2s; }
  .cct-checkbox.checked { color: var(--primary-dark); border-color: var(--primary); background: var(--primary-light); }
  .cct-checkbox-box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; font-size: 12px; font-weight: 800; }
  .cct-checkbox.checked .cct-checkbox-box { background: var(--primary); border-color: var(--primary); }
  .cct-autocomplete {
    position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; margin-top: 6px; max-height: 200px; overflow-y: auto; box-shadow: var(--shadow-md); z-index: 20;
  }
  .cct-autocomplete-item { padding: 11px 16px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
  .cct-autocomplete-item:hover { background: var(--primary-light); color: var(--primary-dark); font-weight: 700; }

  .cct-quick-chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .cct-quick-chip {
    border: 1.5px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 12px;
    cursor: pointer; color: var(--text-muted); font-weight: 700; transition: all 0.2s;
  }
  .cct-quick-chip:hover { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary); }

  .cct-scenario-bar { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
  .cct-scenario-btn {
    border: 1.5px solid var(--border); background: var(--bg); padding: 8px 14px; border-radius: 10px;
    font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.2s;
  }
  .cct-scenario-btn.active { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25); }
</style>

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const RAW_SUPABASE_URL = "https://fgfdvjjrzzjavcseulpg.supabase.co";
const SUPABASE_URL = RAW_SUPABASE_URL.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnZmR2ampyenpqYXZjc2V1bHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDQyODcsImV4cCI6MjEwMzgyMDI4N30.nJ7PCIJiQNUjTUK3cTtYjvdSocJU5XktP2yt-OQVOCE";

const LOGIN_PASSWORD = "65905937";
const STORAGE_KEY_ACTIVE = "cct_active_records";
const STORAGE_KEY_HISTORY = "cct_history_records";

let supabaseClient = null;
let isCloudSynced = false;

if (typeof supabase !== "undefined" && SUPABASE_URL && SUPABASE_ANON_KEY) {
  try {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    isCloudSynced = true;
  } catch (err) {
    console.error("Supabase 連線失敗，自動切換至本機模式", err);
    isCloudSynced = false;
  }
}

function toDbRecord(r, isHistory = false) {
  const rec = {
    id: r.id,
    warehouse: r.warehouse,
    category: r.category,
    erliansubtype: r.erlianSubType || r.erliansubtype || "delivery",
    createdat: r.createdAt || r.createdat || new Date().toISOString(),
    phonelast3: r.phoneLast3 || r.phonelast3 || "",
    lastname: r.lastName || r.lastname || "",
    gender: r.gender || "先生",
    area: r.area || "",
    contact: r.contact || "",
    fields: r.fields || {},
    updatedat: r.updatedAt || r.updatedat || new Date().toISOString()
  };
  if (isHistory) {
    rec.resolvedat = r.resolvedAt || r.resolvedat || new Date().toISOString();
  }
  return rec;
}

function fromDbRecord(r) {
  if (!r) return null;
  return {
    id: r.id,
    warehouse: r.warehouse,
    category: r.category,
    erlianSubType: r.erlianSubType || r.erliansubtype || "delivery",
    createdAt: r.createdAt || r.createdat,
    resolvedAt: r.resolvedAt || r.resolvedat,
    phoneLast3: r.phoneLast3 || r.phonelast3 || "",
    lastName: r.lastName || r.lastname || "",
    gender: r.gender || "先生",
    area: r.area || "",
    contact: r.contact || "",
    fields: r.fields || {},
    updatedAt: r.updatedAt || r.updatedat
  };
}

const CATEGORIES = [
  { id: "approve", label: "約配未接", color: "#4F46E5" },
  { id: "erlian", label: "二聯未接", color: "#D97706" },
  { id: "complaint", label: "客訴未接", color: "#DC2626" },
  { id: "zilian", label: "轉自聯", color: "#7C3AED" },
  { id: "other", label: "其他", color: "#475569" },
];
const CAT_MAP = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

const ERLIAN_SUBTYPES = [
  { id: "delivery", label: "配送 (一般)" },
  { id: "rail", label: "電軌升級" },
  { id: "complaint", label: "客訴件" },
];

const PLATE_OPTIONS = ["展", "陳", "9119", "3857", "6852"];

function getCategoryFields(category, erlianSubType = "delivery") {
  if (category === "approve") {
    return [
      { key: "availableTrip", label: "目前可提供車趟", type: "text" },
      { key: "note", label: "備註", type: "textarea" },
    ];
  }
  if (category === "erlian") {
    if (erlianSubType === "delivery") {
      return [
        { key: "scheduledDate", label: "約定配送日期", type: "date" },
        { key: "plate", label: "車牌", type: "datalist", options: PLATE_OPTIONS },
        { key: "eta", label: "預計抵達時間", type: "text" },
        { key: "balance", label: "尾款", type: "checkbox" },
        { key: "note", label: "備註", type: "textarea" },
      ];
    }
    if (erlianSubType === "rail") {
      return [
        { key: "scheduledDate", label: "升級約定日期", type: "date" },
        { key: "scheduledTime", label: "安排時段", type: "text" },
        { key: "plate", label: "車牌", type: "datalist", options: PLATE_OPTIONS },
        { key: "balance", label: "尾款", type: "checkbox" },
        { key: "note", label: "備註", type: "textarea" },
      ];
    }
    if (erlianSubType === "complaint") {

function formatArea(county, district) {
  const shortCounty = county.replace(/[市縣]$/, "");
  let label = district;
  if (district.endsWith("區")) {
    const stripped = district.slice(0, -1);
    label = stripped.length === 1 ? district : stripped;
  } else if (district.endsWith("鎮") || district.endsWith("鄉")) {
    label = district.slice(0, -1);
  } else if (district.endsWith("市")) {
    const stripped = district.slice(0, -1);
    if (stripped === shortCounty) return district;
    label = stripped;
  }
  return shortCounty + label;
}
function buildAreaList(raw) {
  return Object.entries(raw).flatMap(([county, districts]) => districts.map(d => formatArea(county, d)));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmtDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso), p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function daysSince(iso) { return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000)); }
function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function copyToClipboard(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  ta.style.top = "-9999px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
  } catch (err) {
    console.error("複製失敗", err);
  }
  document.body.removeChild(ta);
}

async function fetchCloudData(silent = false) {
  if (!supabaseClient) return;
  try {
    const { data: aData, error: aErr } = await supabaseClient.from('active_records').select('*');
    if (!aErr && aData) state.activeRecords = aData.map(fromDbRecord);

    const { data: hData, error: hErr } = await supabaseClient.from('history_records').select('*');
    if (!hErr && hData) state.historyRecords = hData.map(fromDbRecord);

    if (!silent) render();
    else {
      const activeEl = document.activeElement;
      if (!activeEl || (activeEl.tagName !== 'INPUT' && activeEl.tagName !== 'TEXTAREA')) {
        render();
      }
    }
  } catch (err) {
    console.error("讀取雲端資料失敗", err);
  }
}

async function initCloudSync() {
  loadStorage();
  
  if (!isCloudSynced || !supabaseClient) {
    console.log("未設定 Supabase 金鑰，自動開啟 LocalStorage 本機模式");
    render();
    return;
  }

  await fetchCloudData();

  // 定期輪詢 (每 5 秒備援刷新)
  setInterval(() => {
    fetchCloudData(true);
  }, 5000);

  // 安全地偵測當前環境（Canvas / Sandbox）是否允許建立 WebSocket
  let supportsWebSocket = false;
  try {
    if (typeof WebSocket !== 'undefined') {
      const wsUrl = SUPABASE_URL.replace(/^http/, 'ws') + '/realtime/v1/websocket';
      const testWs = new WebSocket(wsUrl);
      testWs.onerror = () => {};
      testWs.close();
      supportsWebSocket = true;
    }
  } catch (wsTestErr) {
    console.warn("當前沙盒環境 (Canvas) 限制 WebSocket 連線，已自動啟用 HTTP REST 定時輪詢模式。");
    supportsWebSocket = false;
  }

  // 僅在允許 WebSocket 的非沙盒環境中啟動 Supabase Realtime 廣播
  if (supportsWebSocket) {
    try {
      supabaseClient
        .channel('public:records')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'active_records' }, () => fetchCloudData(true))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'history_records' }, () => fetchCloudData(true))
        .subscribe((status, err) => {
          if (err) console.warn("Supabase Realtime 訂閱狀態:", status, err);
        });
    } catch (wsErr) {
      console.warn("Realtime WebSocket 訂閱失敗，改用 HTTP 定時輪詢");
    }
  }
}

async function saveEdit() {
  const f = state.editForm;
  if (!f.phoneLast3.trim()) {
    const input = document.getElementById("editPhoneInput");
    const err = document.getElementById("editPhoneError");
    if (err) err.style.display = "block";
    if (input) { input.style.borderColor = "#B96B6B"; input.focus(); }
    return;
  }

  const updatedRecord = {
    category: f.category,
    erlianSubType: f.erlianSubType || "delivery",
    phoneLast3: f.phoneLast3.trim(),
    lastName: f.lastName.trim(),
    gender: f.gender,
    area: f.area,
    contact: f.contact,
    fields: { ...f.fields },
    updatedAt: new Date().toISOString(),
  };

  const isHist = state.editType !== "active";
  if (state.editType === "active") {
    const idx = state.activeRecords.findIndex(r => r.id === f.id);
    if (idx !== -1) {
      state.activeRecords[idx] = { ...state.activeRecords[idx], ...updatedRecord };
      saveActiveLocal();
    }
  } else {
    const idx = state.historyRecords.findIndex(r => r.id === f.id);
    if (idx !== -1) {
      state.historyRecords[idx] = { ...state.historyRecords[idx], ...updatedRecord };
      saveHistoryLocal();
    }
  }
  closeEdit();

  if (isCloudSynced && supabaseClient) {
    try {
      const table = isHist ? 'history_records' : 'active_records';
      const fullRecord = { ...state.editForm, ...updatedRecord };
      const { error } = await supabaseClient.from(table).update(toDbRecord(fullRecord, isHist)).eq('id', f.id);
      if (error) console.error("Cloud update error:", error);
    } catch (e) { console.error("Cloud update failed:", e); }
  }
}

function renderCard(record, showConvert, resolved) {
  const cat = CAT_MAP[record.category] || { label: "其他", color: "#9B9B93" };
  const fieldDefs = getCategoryFields(record.category, record.erlianSubType);
  const days = daysSince(record.createdAt);
  
  let catLabel = cat.label;
  if (record.category === "erlian") {
    const sub = ERLIAN_SUBTYPES.find(s => s.id === record.erlianSubType);
    if (sub) catLabel += ` · ${sub.label}`;
  }

  const extras = fieldDefs.map(f => {
    const v = record.fields?.[f.key];
    if (f.type === "checkbox") {
      if (!v) return "";
      return `<div class="cct-extra-item"><span class="cct-balance-badge">✓ 有${esc(f.label)}</span></div>`;
    }
    if (!v) return "";
    const displayVal = f.type === "date" ? fmtDate(v) : v;
    return `<div class="cct-extra-item"><span class="cct-extra-label">${esc(f.label)}</span><span class="cct-extra-value">${esc(displayVal)}</span></div>`;
  }).join("");
  const hasExtra = extras.trim().length > 0;

  return `
    <div class="cct-card" style="--cat-color:${cat.color}">
      <div class="cct-card-bar"></div>
      <div class="cct-card-body">
        <div class="cct-card-top">
          <span class="cct-tag" style="background:${cat.color}">${esc(catLabel)}</span>
          <span class="cct-card-time">🕓 ${fmtDateTime(record.createdAt)}
            ${!resolved && days >= 1 ? `<span class="cct-age-badge">已等 ${days} 天</span>` : ""}
          </span>
        </div>
        <div class="cct-card-main">
          <span class="cct-phone">📞 ${esc(record.phoneLast3)}</span>
          <span class="cct-name">${esc(record.lastName || "—")}${esc(record.gender)}</span>
          <span class="cct-area">${esc(record.area || "未填區域")}</span>
          <span class="cct-contact">窗口：${esc(record.contact)}</span>
        </div>
        ${hasExtra ? `<div class="cct-card-extra">${extras}</div>` : ""}
        ${resolved && record.resolvedAt ? `<div class="cct-resolved-note">已於 ${fmtDate(record.resolvedAt)} 完成處理</div>` : ""}
        <div class="cct-card-actions">
          ${!resolved && record.category !== "zilian" ? `
            <button type="button" class="cct-btn cct-btn-outline" data-act="chat-biz" data-id="${record.id}" title="產生通報範本快速聯絡業務">💬 聯絡業務</button>
          ` : ""}
          ${!resolved && showConvert ? `
            <button type="button" class="cct-btn cct-btn-outline" data-act="convert" data-id="${record.id}">⇄ 轉入自聯</button>
          ` : ""}
          <button type="button" class="cct-btn cct-btn-outline" data-act="open-edit" data-id="${record.id}" data-type="${resolved ? 'history' : 'active'}">✏️ 編輯</button>
          ${!resolved ? `
            <button type="button" class="cct-btn cct-btn-primary" data-act="done" data-id="${record.id}">✓ 標記已處理</button>
          ` : ""}
        </div>
      </div>
    </div>
  `;
}

function renderDynamicField(field, value, scope) {
  const val = value || "";
  if (field.type === "textarea") {
    return `<div class="cct-field"><label>${esc(field.label)}</label><textarea rows="2" data-scope="${scope}" data-key="${field.key}" data-act="field" placeholder="請輸入${esc(field.label)}">${esc(val)}</textarea></div>`;
  }
  if (field.type === "checkbox") {
    const checked = !!value;
    return `
      <div class="cct-field">
        <label>${esc(field.label)}</label>
        <button type="button" class="cct-checkbox ${checked?'checked':''}" data-scope="${scope}" data-key="${field.key}" data-act="checkbox">
          <span class="cct-checkbox-box">${checked ? "✓" : ""}</span>
          ${checked ? `有${esc(field.label)}` : `無${esc(field.label)}`}
        </button>
      </div>`;
  }
  if (field.type === "datalist") {
    const listId = `dl-${scope}-${field.key}`;
    return `
      <div class="cct-field">
        <label>${esc(field.label)}</label>
        <input type="text" list="${listId}" value="${esc(val)}" data-scope="${scope}" data-key="${field.key}" data-act="field" placeholder="請選擇或手動輸入車牌" />
        <datalist id="${listId}">
          ${(field.options || []).map(opt => `<option value="${esc(opt)}"></option>`).join("")}
        </datalist>
        <div class="cct-quick-chips">
          ${(field.options || []).map(opt => `<button type="button" class="cct-quick-chip" data-scope="${scope}" data-key="${field.key}" data-val="${esc(opt)}" data-act="setQuickChip">${esc(opt)}</button>`).join("")}
        </div>
      </div>
    `;
  }
  return `<div class="cct-field"><label>${esc(field.label)}</label><input type="${field.type==='date'?'date':'text'}" value="${esc(val)}" data-scope="${scope}" data-key="${field.key}" data-act="field" /></div>`;
}

function renderAreaField(scope, value) {
  return `
    <div class="cct-field">
      <label>配送區域</label>
      <input type="text" id="area-input-${scope}" placeholder="輸入關鍵字，如「善化」" value="${esc(value)}" data-scope="${scope}" data-act="areaInput" autocomplete="off" />
      <div class="cct-autocomplete-slot" id="area-dropdown-${scope}"></div>
    </div>
  `;
}

function updateAreaDropdown(scope) {
  const container = document.getElementById(`area-dropdown-${scope}`);
  if (!container) return;
  let value = "";
  if (scope === "add") value = state.addForm.area;
  else if (scope === "edit") value = state.editForm.area;
  else if (scope === "convert") value = state.convertForm.area;

  const wh = WAREHOUSES[state.warehouse];
  const matches = value ? wh.areas.filter(a => a.includes(value)).slice(0, 8) : [];

  if (matches.length === 0) {
    container.innerHTML = "";
    container.classList.remove("cct-autocomplete");
    return;
  }
  container.classList.add("cct-autocomplete");
  container.innerHTML = matches
    .map(m => `<div class="cct-autocomplete-item" data-value="${esc(m)}">${esc(m)}</div>`)
    .join("");
  container.querySelectorAll(".cct-autocomplete-item").forEach(item => {
    item.onmousedown = (e) => {
      e.preventDefault();
      const v = item.dataset.value;
      if (scope === "add") state.addForm.area = v;
      else if (scope === "edit") state.editForm.area = v;
      else state.convertForm.area = v;

      const inputEl = document.getElementById(`area-input-${scope}`);
      if (inputEl) inputEl.value = v;
      container.innerHTML = "";
      container.classList.remove("cct-autocomplete");
    };
  });
}

function bindEvents() {
  const app = document.getElementById("app");

  app.querySelectorAll('[data-act]').forEach(el => {
    const act = el.dataset.act;

    if (act === "pick-wh") el.onclick = () => { state.loginPickWarehouse = el.dataset.wh; render(); };
    if (act === "login") el.onclick = () => doLogin();
    if (act === "logout") el.onclick = () => doLogout();
    if (act === "tab") el.onclick = () => { state.tab = el.dataset.tab; render(); };
    if (act === "subtab") el.onclick = () => { state.subTab = el.dataset.subtab; render(); };
    if (act === "filterCat") el.onclick = () => { state.filterCat = el.dataset.cat; render(); };
    if (act === "clearDate") el.onclick = () => { state.filterDate = ""; render(); };

    if (act === "open-add") el.onclick = () => openAdd();
    if (act === "close-add") el.onclick = () => closeAdd();
    if (act === "backdrop-add") el.onclick = (e) => { if (e.target === el) closeAdd(); };
    if (act === "save-add") el.onclick = () => saveAdd();
    if (act === "pickCat") el.onclick = () => { state.addForm.category = el.dataset.cat; render(); };
    if (act === "pickErlianSub") el.onclick = () => { state.addForm.erlianSubType = el.dataset.sub; render(); };
    if (act === "addGender") el.onclick = () => { state.addForm.gender = el.dataset.g; render(); };

    if (act === "open-edit") el.onclick = () => openEdit(el.dataset.id, el.dataset.type);
    if (act === "close-edit") el.onclick = () => closeEdit();
    if (act === "backdrop-edit") el.onclick = (e) => { if (e.target === el) closeEdit(); };
    if (act === "save-edit") el.onclick = () => saveEdit();
    if (act === "pickEditCat") el.onclick = () => { state.editForm.category = el.dataset.cat; render(); };
    if (act === "pickEditErlianSub") el.onclick = () => { state.editForm.erlianSubType = el.dataset.sub; render(); };
    if (act === "editGender") el.onclick = () => { state.editForm.gender = el.dataset.g; render(); };

    if (act === "chat-biz") el.onclick = () => openChatBiz(el.dataset.id);
    if (act === "close-chat") el.onclick = () => closeChatBiz();
    if (act === "backdrop-chat") el.onclick = (e) => { if (e.target === el) closeChatBiz(); };
    if (act === "copy-chat") el.onclick = () => doCopyChat();
    if (act === "switchScenario") el.onclick = () => switchChatScenario(el.dataset.sc);

    if (act === "done") el.onclick = () => markDone(el.dataset.id);
    if (act === "convert") el.onclick = () => openConvert(el.dataset.id);
    if (act === "close-convert") el.onclick = () => closeConvert();
    if (act === "backdrop-convert") el.onclick = (e) => { if (e.target === el) closeConvert(); };
    if (act === "confirm-convert") el.onclick = () => confirmConvert();

    if (act === "checkbox") el.onclick = () => {
      const scope = el.dataset.scope, key = el.dataset.key;
      const target = scope === "add" ? state.addForm.fields : (scope === "edit" ? state.editForm.fields : state.convertForm);
      if (target) {
        target[key] = !target[key];
        render();
      }
    };

    if (act === "setQuickChip") el.onclick = () => {
      const scope = el.dataset.scope, key = el.dataset.key, val = el.dataset.val;
      const target = scope === "add" ? state.addForm.fields : (scope === "edit" ? state.editForm.fields : state.convertForm);
      if (target) {
        target[key] = val;
        render();
      }
    };
  });

  const searchInput = app.querySelector("#searchInput");
  if (searchInput) searchInput.oninput = (e) => { state.search = e.target.value.replace(/[^0-9]/g, ""); renderListOnly(); };

  const dateInput = app.querySelector("#dateInput");
  if (dateInput) dateInput.onchange = (e) => { state.filterDate = e.target.value; render(); };

  const zilianSearchInput = app.querySelector("#zilianSearchInput");
  if (zilianSearchInput) zilianSearchInput.oninput = (e) => { state.zilianSearch = e.target.value; renderListOnly(); };

  const loginPwdInput = app.querySelector("#loginPwdInput");
  if (loginPwdInput) {
    loginPwdInput.oninput = (e) => { state.loginPwd = e.target.value; state.loginError = ""; };
    loginPwdInput.onkeydown = (e) => { if (e.key === "Enter") doLogin(); };
  }

  const chatTextArea = app.querySelector("#chatTextArea");
  if (chatTextArea) {
    chatTextArea.oninput = (e) => { state.chatText = e.target.value; };
  }

  app.querySelectorAll('[data-act="addPhone"]').forEach(el => {
    el.oninput = (e) => {
      state.addForm.phoneLast3 = e.target.value.replace(/[^0-9]/g, "");
      e.target.value = state.addForm.phoneLast3;
      el.style.borderColor = "";
      const err = document.getElementById("phoneError");
      if (err) err.style.display = "none";
    };
  });
  app.querySelectorAll('[data-act="addLastName"]').forEach(el => { el.oninput = (e) => { state.addForm.lastName = e.target.value; }; });
  app.querySelectorAll('[data-act="addContact"]').forEach(el => { el.onchange = (e) => { state.addForm.contact = e.target.value; }; });

  app.querySelectorAll('[data-act="editPhone"]').forEach(el => {
    el.oninput = (e) => {
      state.editForm.phoneLast3 = e.target.value.replace(/[^0-9]/g, "");
      e.target.value = state.editForm.phoneLast3;
      el.style.borderColor = "";
      const err = document.getElementById("editPhoneError");
      if (err) err.style.display = "none";
    };
  });
  app.querySelectorAll('[data-act="editLastName"]').forEach(el => { el.oninput = (e) => { state.editForm.lastName = e.target.value; }; });
  app.querySelectorAll('[data-act="editContact"]').forEach(el => { el.onchange = (e) => { state.editForm.contact = e.target.value; }; });

  app.querySelectorAll('[data-act="field"]').forEach(el => {
    el.oninput = (e) => {
      const scope = el.dataset.scope, key = el.dataset.key;
      const target = scope === "add" ? state.addForm.fields : (scope === "edit" ? state.editForm.fields : state.convertForm);
      if (target) target[key] = e.target.value;
    };
  });

  app.querySelectorAll('[data-act="areaInput"]').forEach(el => {
    const scope = el.dataset.scope;
    el.oninput = (e) => {
      if (scope === "add") state.addForm.area = e.target.value;
      else if (scope === "edit") state.editForm.area = e.target.value;
      else state.convertForm.area = e.target.value;
      updateAreaDropdown(scope);
    };
    el.onfocus = () => updateAreaDropdown(scope);
    el.onblur = () => {
      setTimeout(() => {
        const container = document.getElementById(`area-dropdown-${scope}`);
        if (container) { container.innerHTML = ""; container.classList.remove("cct-autocomplete"); }
      }, 150);
    };
  });
}

function renderListOnly() {
  if (state.tab === "overview") {
    const mainEl = document.querySelector(".cct-main");
    const activeEl = document.activeElement;
    const cursorPos = activeEl && activeEl.selectionStart;
    const wasSearch = activeEl && activeEl.id === "searchInput";
    mainEl.innerHTML = renderOverview();
    bindEvents();
    if (wasSearch) {
      const again = document.querySelector("#searchInput");
      if (again) { again.focus(); if (cursorPos != null) again.setSelectionRange(cursorPos, cursorPos); }
    }
  } else {
    const mainEl = document.querySelector(".cct-main");
    const activeEl = document.activeElement;
    const cursorPos = activeEl && activeEl.selectionStart;
    const wasSearch = activeEl && activeEl.id === "zilianSearchInput";
    mainEl.innerHTML = renderZilian();
    bindEvents();
    if (wasSearch) {
      const again = document.querySelector("#zilianSearchInput");
      if (again) { again.focus(); if (cursorPos != null) again.setSelectionRange(cursorPos, cursorPos); }
    }
  }
}

initCloudSync();
render();
</script>
</body>
</html>
